# Default configuration. Every value can be overridden on the command line with Hydra syntax,
# e.g. `python main.py stage=final train.lr=3e-5 final.best_params_path=outputs/tune/best_params.json`.
defaults:
  - label_map: nemotron_to_opf_v2
  - _self_

stage: preprocess        # preprocess | tune | final | calibrate | test | predict | baseline_opf
seed: 13

paths:                   # relative paths are resolved against the directory main.py is launched from
  raw_dir: data_raw
  cache_dir: cache
  output_dir: outputs

data:
  train_file: ${paths.raw_dir}/train.parquet
  test_file: ${paths.raw_dir}/test.parquet
  locales: [us, intl]
  max_train_docs: null   # cap on training rows read from train_file (null = all)
  max_test_docs: null    # cap on test rows read from test_file (null = all)
  val_fraction: 0.1      # validation split (tuning / early stopping), grouped by uid
  calib_fraction: 0.05   # calibration split (Platt + thresholds); never used for training, grouped by uid
  max_length: 1024       # tokens per window, including <bos>/<eos>
  stride: 256            # tokens shared by consecutive windows of a long document
  num_proc: 4            # processes for datasets.map during preprocessing (null = 1)

model:
  name: jhu-clsp/mmBERT-small
  dropout: 0.1

train:
  epochs: 3
  batch_size: 16
  lr: 5.0e-5             # encoder learning rate
  head_lr: 5.0e-4        # tag / sensitivity heads
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  amp: true              # bf16 autocast when running on CUDA
  device: auto           # auto | cpu | cuda
  num_threads: null      # torch CPU threads, all stages (null = cores available to this container/cgroup)
  num_workers: 0         # DataLoader worker processes
  log_every: 50          # steps between loss log lines

loss:                    # token cross-entropy over the BIES labels, as in OPF's fine-tuning code
  background_weight: 1.0 # class weight of "O"; 1.0 = plain CE. A weight w < 1 mostly acts like adding
                         # log(w) to every transition into O at decode time, which stage=calibrate can
                         # set without retraining. Keep 1.0 except for ablations.

decode:                  # constrained BIES Viterbi, same bias keys as OPF viterbi_calibration.json.
                         # Used during training/validation and as the starting point (trial 0) of the
                         # bias search in stage=calibrate; predict uses the biases in calibration.json.
  trim_whitespace: true
  biases:
    transition_bias_background_stay: 0.0
    transition_bias_background_to_start: 0.0
    transition_bias_inside_to_continue: 0.0
    transition_bias_inside_to_end: 0.0
    transition_bias_end_to_background: 0.0
    transition_bias_end_to_start: 0.0

eval:
  max_docs: null         # cap on documents scored per evaluation (null = all); a seeded random sample,
                         # identical for every model and baseline evaluated with the same value
  batch_docs: 256        # documents decoded together (batched Viterbi); their windows share forward passes
  batch_size: 64         # windows per forward pass during evaluation (null = train.batch_size)
  log_every: 2000        # progress line every N documents during evaluation (0 = off)

tune:
  name: pii_mmbert_tune
  metric: val_span_f1
  mode: max
  num_samples: 16
  max_concurrent_trials: 2
  resources_per_trial:
    cpu: 4
    gpu: 0.25            # fractional GPU: trials share a card, and its memory is not partitioned
    custom:              # extra Ray resources per trial, passed as-is (null = none)
      "accelerator_type:RTX": 1
  scheduler:             # ASHA; one time unit = one epoch
    type: asha
    grace_period: 1
    reduction_factor: 2
  # Each entry samples one config value addressed by its dotted path.
  # type: loguniform | uniform | choice | randint
  search_space:
    - {param: train.lr, type: loguniform, lower: 1.0e-5, upper: 2.0e-4}
    - {param: train.head_lr, type: loguniform, lower: 1.0e-4, upper: 2.0e-3}
    - {param: train.weight_decay, type: uniform, lower: 0.0, upper: 0.1}
    - {param: train.warmup_ratio, type: choice, values: [0.0, 0.05, 0.1]}
    - {param: train.batch_size, type: choice, values: [8, 16, 32]}
    - {param: model.dropout, type: choice, values: [0.0, 0.1, 0.2]}

final:
  best_params_path: null       # best_params.json written by stage=tune; null = use config values
  include_val_in_train: true   # train the final model on train + validation
  eval_on_test: true
  output_name: final_model

calibration:             # stage=calibrate, all on the calib split: 1) Viterbi biases, 2) Platt + thresholds
  model_dir: ${paths.output_dir}/${final.output_name}
  max_docs: null         # cap on calib documents (null = all); their log-probs are held in memory
  beta: 1.0              # biases and thresholds maximise F-beta (beta > 1 favours recall)
  bias_search:
    enabled: true
    num_samples: 100     # random candidates; trial 0 is always decode.biases. Each re-decodes the whole calib
                         # split (~10 s on CPU for 5,030 documents), so 100 takes ~15-20 min
    min_improvement: 0.005   # keep decode.biases unless the best candidate gains at least this much F-beta
    # Same format as tune.search_space, keyed by bias name. Unlisted biases keep their decode.biases
    # value. background_stay is left out: adding one constant to all six biases changes no path.
    search_space:
      - {param: transition_bias_background_to_start, type: uniform, lower: -3.0, upper: 3.0}
      - {param: transition_bias_end_to_start, type: uniform, lower: -3.0, upper: 3.0}
      - {param: transition_bias_end_to_background, type: uniform, lower: -3.0, upper: 3.0}
      - {param: transition_bias_inside_to_continue, type: uniform, lower: -3.0, upper: 3.0}
      - {param: transition_bias_inside_to_end, type: uniform, lower: -3.0, upper: 3.0}
  per_type: true         # fit Platt and threshold per span type
  min_spans_per_type: 50 # fewer calibration spans than this -> global Platt fit and global threshold
  zero_positive_policy: global   # type with enough calib spans but none correct: global | reject (drop type)
  output_file: calibration.json   # written into model_dir; stage=predict applies it when present

baseline:                # stage=baseline_opf: OpenAI Privacy Filter on the same test docs (eval.max_docs sample)
  opf:
    checkpoint: null     # null = OPF's default checkpoint location (downloaded on first use)
    device: auto         # auto | cpu | cuda
    context_window_length: null   # null = OPF default (128,000 tokens on GPU, 4,096 on CPU)
    output_name: baseline_opf     # outputs/<name>/: run.json, predictions.jsonl (resumable), metrics.json

test:                    # stage=test: score a trained model on the test split (the eval.max_docs sample)
  model_dir: ${paths.output_dir}/${final.output_name}
  output_file: test_metrics.json  # written into model_dir; with calibration.json: before / biases_only / after

predict:
  model_dir: ${paths.output_dir}/${final.output_name}
  text: "Hi, I'm Daniel Whitfield, born 14 March 1987. Reach me at daniel.w@example.com or +1 415-555-0123."

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
