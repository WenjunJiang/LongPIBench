[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-mmbert"
version = "0.1.0"
description = "PII span tagger on mmBERT-small with OPF-style BIES labels and constrained Viterbi decoding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.48",
    "ray[tune]>=2.40",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "datasets>=3.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pii_mmbert"]
